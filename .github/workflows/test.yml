name: Python tests (no hardware)
on:
  push:
  pull_request:
jobs:
  unittest:
    name: Simulation tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run no-hardware unit tests
        run: python -m unittest discover -s tests -v
